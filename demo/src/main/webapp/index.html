<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprout — a Java frontend framework</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; color: #1b2b1b; background: #f5faf3; }
      header { padding: 20px 16px; border-bottom: 1px solid #d9e8d3; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      h2 { margin: 0 0 12px; font-size: 18px; }
      p.sub { margin: 0; color: #567; font-size: 13px; }
      main { max-width: 640px; margin: 0 auto; padding: 16px; }

      .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      .nav a { text-decoration: none; padding: 6px 12px; border-radius: 6px;
               border: 1px solid #cfe3c5; color: #2e5e1e; background: #fff; }
      .nav a:hover { background: #eaf5e4; }

      button { font: inherit; padding: 6px 14px; border: 1px solid #6aa84f; border-radius: 6px;
               background: #eaf5e4; color: #204010; cursor: pointer; }
      button:hover { background: #dcefd2; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      button:disabled:hover { background: #eaf5e4; }

      .row { display: flex; gap: 8px; margin-bottom: 12px; }
      .row input { flex: 1; min-width: 0; font: inherit; padding: 6px 10px;
                   border: 1px solid #cfe3c5; border-radius: 6px; }

      .reverse { margin-bottom: 10px; padding: 4px 10px; font-size: 13px; }

      ul { list-style: none; padding: 0; margin: 0; }
      .todo { display: flex; align-items: center; gap: 6px;
              padding: 6px 8px; border: 1px solid #e3efdc; border-radius: 6px; margin-bottom: 6px;
              background: #fff; }
      .todo .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .todo .text.done { text-decoration: line-through; color: #8aa; }
      .todo button { padding: 2px 8px; }
      .todo .check { flex: none; width: 18px; height: 18px; margin: 0;
                     accent-color: #6aa84f; cursor: pointer; }
      .todo .x { border-color: #e0a3a3; background: #fbeaea; color: #7a1f1f; }
      .empty { color: #789; }
      .meta { color: #789; font-size: 13px; }
      .todo a { color: inherit; text-decoration: none; }
      .todo a:hover { text-decoration: underline; }
      /* a failed fetch, and the error boundary around a component that threw */
      .error, .sprout-error { padding: 8px 10px; border-radius: 6px;
                              border: 1px solid #e0a3a3; background: #fbeaea; color: #7a1f1f; }

      .counter { display: flex; align-items: center; gap: 4px; margin: 8px 0; }
      .counter .count { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
    </style>
    <!-- Compiled from Java to WebAssembly (WasmGC) by TeaVM.
         Absolute paths: routes like /data/3 must load the same assets. -->
    <script type="text/javascript" charset="utf-8" src="/teavm/wasm-gc-runtime.js"></script>
  </head>
  <body onload="TeaVM.wasmGC.load('/teavm/classes.wasm').then(t => t.exports.main([]))">
    <header>
      <h1>🌱 Sprout</h1>
      <p class="sub">A React-style, Spring-flavored frontend framework — written in Java, compiled to your browser.</p>
    </header>
    <main>
      <div id="app"></div>
    </main>
  </body>
</html>
